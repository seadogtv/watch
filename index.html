<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>seadogtv</title>
    <link rel="icon" type="image/png" href="https://orbitcloud.vaneltonmedia.com/fb8b4ce080e59805fcd247391a5574e8/logo.png" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" href="https://orbitcloud.vaneltonmedia.com/fb8b4ce080e59805fcd247391a5574e8/logo_dark.png" media="(prefers-color-scheme: light)">
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pirata+One&family=Inter:wght@300;400;500;600&display=swap');
        * {
            font-family: 'Inter', sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        img {
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
            pointer-events: none;
        }
        body {
            background: #0a0a0a;
            color: #e5e5e5;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }
        .pirate-title {
            font-family: 'Pirata One', cursive;
            font-size: 2rem;
            letter-spacing: 0.02em;
            color: #ffffff;
            text-transform: lowercase;
        }
        .tv-title {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 1.75rem;
            letter-spacing: 0.02em;
            color: #888888;
            margin-left: 2px;
        }
        .login-btn {
            color: #ffffff;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.5rem 1.5rem;
            border-radius: 9999px;
            transition: all 0.2s;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: transparent;
        }
        .login-btn:hover {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }
        .channel-card {
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
            border: 2px solid transparent;
            background: #111;
            outline: none;
            flex-shrink: 0;
            width: 180px;
        }
        @media (min-width: 480px) {
            .channel-card {
                width: 200px;
            }
        }
        @media (min-width: 768px) {
            .channel-card {
                width: 220px;
            }
        }
        @media (min-width: 1024px) {
            .channel-card {
                width: 260px;
            }
        }
        @media (min-width: 1440px) {
            .channel-card {
                width: 300px;
            }
        }
        @media (min-width: 1920px) {
            .channel-card {
                width: 340px;
            }
        }
        @media (min-width: 2560px) {
            .channel-card {
                width: 400px;
            }
        }
        .channel-card.selected {
            border-color: #4a4a4a;
            background: #161616;
        }
        .channel-card.selected .play-overlay {
            opacity: 1;
        }
        .play-overlay {
            opacity: 0;
            transition: opacity 0.2s;
            background: rgba(0, 0, 0, 0.6);
            pointer-events: none;
        }
        .play-overlay i {
            font-size: 2rem;
        }
        @media (min-width: 1024px) {
            .play-overlay i {
                font-size: 2.5rem;
            }
        }
        @media (min-width: 1440px) {
            .play-overlay i {
                font-size: 3rem;
            }
        }
        .category-row {
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            display: flex;
            gap: 0.875rem;
        }
        @media (min-width: 1024px) {
            .category-row {
                gap: 1rem;
            }
        }
        @media (min-width: 1440px) {
            .category-row {
                gap: 1.25rem;
            }
        }
        @media (min-width: 1920px) {
            .category-row {
                gap: 1.5rem;
            }
        }
        .category-row::-webkit-scrollbar {
            display: none;
        }
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 40;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        #mainScroll {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding-top: 1rem;
            padding-bottom: 2rem;
            scroll-behavior: smooth;
        }
        #mainScroll::-webkit-scrollbar {
            display: none;
        }
        .player-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent);
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
        }
        .player-header.hidden-header {
            opacity: 0;
            transform: translateY(-100%);
            pointer-events: none;
        }
        .player-header > * {
            pointer-events: auto;
        }
        .minimize-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background-color 0.2s;
        }
        @media (min-width: 1024px) {
            .minimize-btn {
                width: 48px;
                height: 48px;
            }
        }
        @media (min-width: 1440px) {
            .minimize-btn {
                width: 56px;
                height: 56px;
            }
        }
        .minimize-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .programme-info {
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            padding: 0.75rem 0.5rem 0.5rem;
        }
        .progress-bar {
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #ffffff;
            border-radius: 2px;
            transition: width 0.3s;
        }
        .category-title {
            font-size: 1rem;
        }
        @media (min-width: 1024px) {
            .category-title {
                font-size: 1.125rem;
            }
        }
        @media (min-width: 1440px) {
            .category-title {
                font-size: 1.3125rem;
            }
        }
        .channel-name {
            font-size: 0.75rem;
        }
        @media (min-width: 1024px) {
            .channel-name {
                font-size: 0.875rem;
            }
        }
        @media (min-width: 1440px) {
            .channel-name {
                font-size: 1rem;
            }
        }
        .now-playing-text {
            font-size: 0.625rem;
        }
        @media (min-width: 1024px) {
            .now-playing-text {
                font-size: 0.75rem;
            }
        }
        @media (min-width: 1440px) {
            .now-playing-text {
                font-size: 0.875rem;
            }
        }
        #loadingScreen {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
        }
        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-logo-container {
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loading-logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .loading-title {
            font-family: 'Pirata One', cursive;
            font-size: 2.5rem;
            letter-spacing: 0.02em;
            color: #ffffff;
            text-transform: lowercase;
        }
        .loading-tv-title {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 2rem;
            letter-spacing: 0.02em;
            color: #888888;
            margin-left: 2px;
        }
        .loading-content {
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% {
                opacity: 0.7;
            }
            50% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <div id="loadingScreen">
        <div class="loading-content flex items-center gap-3">
            <div class="loading-logo-container">
                <img src="https://orbitcloud.vaneltonmedia.com/fb8b4ce080e59805fcd247391a5574e8/logo.png" alt="seadogtv">
            </div>
            <h1 class="loading-title">seadog<span class="loading-tv-title">tv</span></h1>
        </div>
    </div>

    <header>
        <div class="max-w-full px-4 py-3 flex items-center justify-between">
            <h1 class="pirate-title">seadog<span class="tv-title">tv</span></h1>
            <button class="login-btn" onclick="handleLogin()">Entrar</button>
        </div>
    </header>

    <main id="mainScroll">
        <div id="content"></div>
    </main>

    <div id="player" class="fixed inset-0 z-50 hidden bg-black">
        <div class="relative h-full">
            <iframe id="modalIframe" class="w-full h-full" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            <div class="player-header flex items-center justify-between px-5 py-4" id="playerHeader">
                <div class="flex items-center gap-3">
                    <img id="modalLogo" src="" alt="" class="w-10 h-10 rounded bg-[#1a1a1a] object-cover flex-shrink-0">
                    <div class="space-y-0.5">
                        <span id="modalName" class="text-sm font-medium block"></span>
                        <span id="modalNowPlaying" class="text-xs text-gray-300 block"></span>
                    </div>
                </div>
                <button onclick="closePlayer()" class="minimize-btn text-white">
                    <i class="fa-solid fa-chevron-down text-xl"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Bloquear menu de contexto
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // Bloquear arrasto de imagens
        document.addEventListener('dragstart', (e) => {
            if (e.target.tagName === 'IMG') {
                e.preventDefault();
            }
        });

        const CHANNELS_API = 'https://opensheet.elk.sh/13_CjXtUc2AUF5qKE__Z7H_ruu_IjEXmQ0Js3trZ32ZM/1';
        const GUIDE_API = 'https://reidosembeds.online/api/channels';
        const content = document.getElementById('content');
        const mainScroll = document.getElementById('mainScroll');
        const player = document.getElementById('player');
        const iframe = document.getElementById('modalIframe');
        const modalLogo = document.getElementById('modalLogo');
        const modalName = document.getElementById('modalName');
        const modalNowPlaying = document.getElementById('modalNowPlaying');
        const playerHeader = document.getElementById('playerHeader');
        const loadingScreen = document.getElementById('loadingScreen');

        let allChannels = [];
        let guideData = {};
        let categories = {};
        let playerOpen = false;
        let playerCategory = '';
        let playerChannel = 0;
        let headerTimeout;
        let selectedCard = null;
        let activeInput = 'keyboard';
        let mouseMoved = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let scrollAnimationFrame = null;
        let loadingStartTime = Date.now();
        const MINIMUM_LOADING_TIME = 1500;

        const genreLabels = {
            'general': 'Geral',
            'variety': 'Variedades',
            '24h': 'Em looping',
            'sports': 'Esportes',
            'premiere': 'Canais Premiere',
            'espn': 'Canais ESPN',
            'movies': 'Filmes',
            'kids': 'Infantil',
            'music': 'Música',
            'documentary': 'Documentário',
            'entertainment': 'Entretenimento',
            'news': 'Notícias',
            'religion': 'Religião',
            'adult': 'Adulto'
        };

        function handleLogin() {
            // Placeholder para futura implementação
            console.log('Entrar clicked');
        }

        function hideLoadingScreen() {
            const elapsed = Date.now() - loadingStartTime;
            const remaining = Math.max(0, MINIMUM_LOADING_TIME - elapsed);
            
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 300);
            }, remaining);
        }

        function smoothScrollTo(targetScroll) {
            if (scrollAnimationFrame) {
                cancelAnimationFrame(scrollAnimationFrame);
            }
            
            const startScroll = mainScroll.scrollTop;
            const difference = targetScroll - startScroll;
            const duration = 600;
            const startTime = performance.now();
            
            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                const easeInOutCubic = progress < 0.5 
                    ? 4 * progress * progress * progress 
                    : 1 - Math.pow(-2 * progress + 2, 3) / 2;
                
                mainScroll.scrollTop = startScroll + difference * easeInOutCubic;
                
                if (progress < 1) {
                    scrollAnimationFrame = requestAnimationFrame(animate);
                } else {
                    scrollAnimationFrame = null;
                }
            }
            
            scrollAnimationFrame = requestAnimationFrame(animate);
        }

        function selectCard(card, source) {
            if (selectedCard === card) return;
            
            if (source === 'keyboard') {
                activeInput = 'keyboard';
                mouseMoved = false;
            } else if (source === 'mouse') {
                if (activeInput === 'keyboard' && !mouseMoved) return;
                activeInput = 'mouse';
            }
            
            if (selectedCard) {
                selectedCard.classList.remove('selected');
            }
            
            selectedCard = card;
            card.classList.add('selected');
            card.focus();
            
            if (source === 'keyboard') {
                const row = card.closest('.mb-8');
                const mainScrollRect = mainScroll.getBoundingClientRect();
                const rowRect = row.getBoundingClientRect();
                const scrollTop = mainScroll.scrollTop;
                const targetScroll = scrollTop + (rowRect.top - mainScrollRect.top) - (mainScrollRect.height / 2) + (rowRect.height / 2);
                
                smoothScrollTo(Math.max(0, targetScroll));
            }
        }

        function navigateGrid(direction) {
            if (playerOpen) {
                navigatePlayer(direction);
                return;
            }
            
            const cards = Array.from(document.querySelectorAll('.channel-card'));
            if (cards.length === 0) return;
            
            const currentCard = selectedCard || cards[0];
            const currentRow = currentCard.closest('.category-row');
            const cardsInRow = Array.from(currentRow.children);
            const currentIndexInRow = cardsInRow.indexOf(currentCard);
            
            switch(direction) {
                case 'right':
                    if (currentIndexInRow < cardsInRow.length - 1) {
                        selectCard(cardsInRow[currentIndexInRow + 1], 'keyboard');
                        cardsInRow[currentIndexInRow + 1].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    }
                    break;
                case 'left':
                    if (currentIndexInRow > 0) {
                        selectCard(cardsInRow[currentIndexInRow - 1], 'keyboard');
                        cardsInRow[currentIndexInRow - 1].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    }
                    break;
                case 'down':
                    const nextRow = currentRow.closest('.mb-8')?.nextElementSibling?.querySelector('.category-row');
                    if (nextRow) {
                        const nextCards = nextRow.children;
                        const targetIndex = Math.min(currentIndexInRow, nextCards.length - 1);
                        selectCard(nextCards[targetIndex], 'keyboard');
                        nextCards[targetIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    }
                    break;
                case 'up':
                    const prevRow = currentRow.closest('.mb-8')?.previousElementSibling?.querySelector('.category-row');
                    if (prevRow) {
                        const prevCards = prevRow.children;
                        const targetIndex = Math.min(currentIndexInRow, prevCards.length - 1);
                        selectCard(prevCards[targetIndex], 'keyboard');
                        prevCards[targetIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    }
                    break;
                case 'enter':
                    currentCard.click();
                    break;
            }
        }

        document.addEventListener('mousemove', (e) => {
            if (e.clientX !== lastMouseX || e.clientY !== lastMouseY) {
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                mouseMoved = true;
            }
        });

        function buildCategories() {
            categories = {};
            allChannels.forEach(channel => {
                const genre = channel.genre || 'general';
                if (!categories[genre]) {
                    categories[genre] = [];
                }
                categories[genre].push(channel);
            });
        }

        function getGuideInfo(slug) {
            return guideData[slug] || null;
        }

        function truncateText(text, maxLength) {
            if (!text) return '';
            return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
        }

        function cardTemplate(channel, categoryKey, index) {
            const cover = channel.cover || channel.logo;
            const logo = channel.logo || channel.cover;
            const guide = getGuideInfo(channel.slug);
            const nowPlaying = guide?.now_playing_title || '';
            
            return `
                <div class="channel-card rounded-lg overflow-hidden" 
                     tabindex="0"
                     data-category="${categoryKey}"
                     data-index="${index}"
                     data-slug="${channel.slug}"
                     onmouseenter="handleCardMouseEnter(this)"
                     onclick='openPlayer("${categoryKey}", ${index})'>
                    <div class="relative aspect-video bg-[#1a1a1a]">
                        <img src="${cover}" alt="${channel.name}" class="w-full h-full object-cover" 
                             onerror="this.style.display='none'">
                        <div class="play-overlay absolute inset-0 flex items-center justify-center">
                            <i class="fa-solid fa-play text-white"></i>
                        </div>
                        ${nowPlaying ? `
                        <div class="absolute bottom-0 left-0 right-0 programme-info">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="now-playing-text text-gray-300 truncate">${truncateText(nowPlaying, 30)}</span>
                            </div>
                            ${guide?.now_playing_progress ? `
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${guide.now_playing_progress}%"></div>
                            </div>
                            ` : ''}
                        </div>
                        ` : ''}
                        ${channel.status !== 'online' ? 
                            '<span class="absolute top-2 right-2 text-[10px] bg-red-900/80 text-red-300 px-2 py-0.5 rounded">OFF</span>' : ''}
                    </div>
                    <div class="p-2 flex items-center gap-2">
                        <img src="${logo}" alt="" class="w-6 h-6 rounded object-cover bg-[#1a1a1a]" 
                             onerror="this.style.display='none'">
                        <h3 class="channel-name font-medium truncate">${channel.name}</h3>
                    </div>
                </div>
            `;
        }

        function handleCardMouseEnter(card) {
            if (mouseMoved) {
                selectCard(card, 'mouse');
            }
        }

        function renderContent() {
            buildCategories();
            let html = '';

            const categoryOrder = ['general', 'variety', '24h', 'sports', 'premiere', 'espn', 'movies', 'kids', 'music', 'documentary', 'entertainment', 'news', 'religion', 'adult'];
            const categoryKeys = categoryOrder.filter(key => categories[key]?.length > 0);

            categoryKeys.forEach((key) => {
                const channels = categories[key];
                html += `
                    <div class="mb-8 px-4">
                        <h2 class="category-title font-semibold mb-3 px-2">${genreLabels[key] || key}</h2>
                        <div class="category-row px-2 pb-2" data-category="${key}">
                            ${channels.map((channel, i) => cardTemplate(channel, key, i)).join('')}
                        </div>
                    </div>
                `;
            });

            content.innerHTML = html;

            requestAnimationFrame(() => {
                const firstCard = document.querySelector('.channel-card');
                if (firstCard && !playerOpen) {
                    selectCard(firstCard, 'keyboard');
                }
            });
        }

        function showPlayerHeader() {
            playerHeader.classList.remove('hidden-header');
            clearTimeout(headerTimeout);
            headerTimeout = setTimeout(() => {
                playerHeader.classList.add('hidden-header');
            }, 3000);
        }

        function openPlayer(categoryKey, index) {
            const channel = categories[categoryKey]?.[index] || 
                           Object.values(categories).flat().find(c => c.slug === index) ||
                           allChannels[index];

            if (!channel) return;

            const actualCategory = Object.keys(categories).find(key => categories[key].includes(channel)) || categoryKey;
            const actualIndex = categories[actualCategory]?.indexOf(channel) ?? index;

            playerCategory = actualCategory;
            playerChannel = actualIndex;
            playerOpen = true;

            iframe.src = channel.url + (channel.url.includes('?') ? '&' : '?') + 'autoplay=1';
            modalLogo.src = channel.logo || channel.cover;
            modalName.textContent = channel.name;
            
            const guide = getGuideInfo(channel.slug);
            modalNowPlaying.textContent = guide?.now_playing_title || '';
            
            player.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            
            showPlayerHeader();
            history.pushState({ playerOpen: true }, '');
        }

        function closePlayer() {
            playerOpen = false;
            player.classList.add('hidden');
            iframe.src = '';
            document.body.style.overflow = '';
            playerHeader.classList.remove('hidden-header');
            
            if (history.state?.playerOpen) {
                history.back();
            }
        }

        window.addEventListener('popstate', (e) => {
            if (playerOpen) {
                playerOpen = false;
                player.classList.add('hidden');
                iframe.src = '';
                document.body.style.overflow = '';
                playerHeader.classList.remove('hidden-header');
            }
        });

        function navigatePlayer(direction) {
            const catKeys = Object.keys(categories).filter(key => categories[key]?.length > 0);
            if (catKeys.length === 0) return;

            const currentCatIndex = catKeys.indexOf(playerCategory);
            if (currentCatIndex === -1) return;

            const currentChannels = categories[playerCategory];
            if (!currentChannels?.length) return;

            if (direction === 'left' || direction === 'right') {
                const newIndex = direction === 'left' ? 
                    (playerChannel - 1 + currentChannels.length) % currentChannels.length : 
                    (playerChannel + 1) % currentChannels.length;
                openPlayer(playerCategory, newIndex);
            } else if (direction === 'up' || direction === 'down') {
                const newCatIndex = direction === 'up' ? 
                    (currentCatIndex - 1 + catKeys.length) % catKeys.length : 
                    (currentCatIndex + 1) % catKeys.length;
                const newCategory = catKeys[newCatIndex];
                openPlayer(newCategory, 0);
            }
        }

        player.addEventListener('mousemove', () => {
            if (playerOpen) {
                showPlayerHeader();
            }
        });

        player.addEventListener('touchstart', () => {
            if (playerOpen) {
                showPlayerHeader();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (playerOpen) {
                showPlayerHeader();
                switch(e.key) {
                    case 'Escape':
                    case 'Backspace':
                        closePlayer();
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        navigatePlayer('left');
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        navigatePlayer('right');
                        break;
                    case 'ArrowUp':
                        e.preventDefault();
                        navigatePlayer('up');
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        navigatePlayer('down');
                        break;
                }
            } else {
                if (!['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp', 'Enter'].includes(e.key)) return;

                e.preventDefault();
                navigateGrid(e.key.replace('Arrow', '').toLowerCase());
            }
        });

        async function loadGuide() {
            try {
                const res = await fetch(GUIDE_API);
                const data = await res.json();
                if (data.success && data.data) {
                    guideData = {};
                    data.data.forEach(channel => {
                        guideData[channel.id] = channel;
                    });
                }
            } catch {
                console.log('Não foi possível carregar o guia de programação');
            }
        }

        async function loadChannels() {
            try {
                const res = await fetch(CHANNELS_API);
                allChannels = await res.json();
                await loadGuide();
                renderContent();
                hideLoadingScreen();
            } catch {
                hideLoadingScreen();
                content.innerHTML = `
                    <div class="text-center py-20 text-gray-600">
                        <i class="fa-solid fa-exclamation-circle text-2xl mb-3"></i>
                        <p class="text-sm">Erro ao carregar canais</p>
                        <button onclick="loadChannels()" class="mt-3 text-gray-400 hover:text-gray-300 text-sm underline">
                            Tentar novamente
                        </button>
                    </div>
                `;
            }
        }

        loadChannels();
    </script>
</body>
</html>
