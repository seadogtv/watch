<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>seadog</title>
    <link rel="icon" type="image/png" href="https://orbitcloud.vaneltonmedia.com/fb8b4ce080e59805fcd247391a5574e8/icon-w.png" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" href="https://orbitcloud.vaneltonmedia.com/fb8b4ce080e59805fcd247391a5574e8/icon-d.png" media="(prefers-color-scheme: light)">
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pirata+One&family=Inter:wght@300;400;500;600&display=swap');
        * {
            font-family: 'Inter', sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        img {
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
            pointer-events: none;
        }
        body {
            background: #0a0a0a;
            color: #e5e5e5;
            overflow: hidden;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        .pirate-title {
            font-family: 'Pirata One', cursive;
            font-size: 2rem;
            letter-spacing: 0.02em;
            color: #ffffff;
            text-transform: lowercase;
        }
        header {
            background: #0a0a0a;
            flex-shrink: 0;
            z-index: 40;
        }
        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
        }
        .header-left {
            display: flex;
            align-items: center;
        }
        .search-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .search-icon {
            cursor: pointer;
            color: #666;
            font-size: 1rem;
            flex-shrink: 0;
            transition: color 0.2s;
        }
        .search-icon:hover {
            color: #ffffff;
        }
        .search-input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.875rem;
            width: 0;
            opacity: 0;
            transition: width 0.3s ease, opacity 0.3s ease;
            pointer-events: none;
        }
        .search-input.active {
            width: 200px;
            opacity: 1;
            pointer-events: auto;
        }
        .search-input::placeholder {
            color: #666;
        }
        #mainScroll {
            flex: 1;
            overflow: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-behavior: smooth;
        }
        #mainScroll::-webkit-scrollbar {
            display: none;
        }
        .player-header {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
            background: #0f0f0f;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
        }
        .player-header.hidden-header {
            opacity: 0;
            transform: translateY(100%);
            pointer-events: none;
        }
        .player-header > * {
            pointer-events: auto;
        }
        .player-header-content {
            background: #0f0f0f;
            padding: 0.75rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .player-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }
        .control-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background-color 0.2s;
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            flex-shrink: 0;
        }
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .control-btn i {
            font-size: 1rem;
        }
        .channel-logo-img {
            object-fit: contain !important;
            background: transparent !important;
        }
        .modal-logo-img {
            object-fit: contain !important;
            background: transparent !important;
        }
        #loadingScreen {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
        }
        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .loading-logo-img {
            width: 72px;
            height: 72px;
            object-fit: contain;
        }
        .loading-content {
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        .guide-wrapper {
            display: flex;
            min-width: fit-content;
            position: relative;
            padding: 0;
        }
        .guide-channels {
            flex-shrink: 0;
            z-index: 10;
        }
        .guide-time-header {
            display: flex;
            height: 40px;
            position: sticky;
            top: 0;
            z-index: 30;
            background: #0a0a0a;
        }
        .guide-time-header-spacer {
            width: 72px;
            flex-shrink: 0;
            background: #0a0a0a;
            position: sticky;
            left: 0;
            z-index: 25;
        }
        .guide-time-header-hours {
            display: flex;
            flex-shrink: 0;
            position: relative;
        }
        .guide-hour {
            width: 120px;
            flex-shrink: 0;
            display: flex;
            align-items: flex-end;
            padding: 0 0.5rem 0.25rem;
            font-size: 0.75rem;
            color: #666;
            position: relative;
            height: 32px;
            margin-top: 4px;
            box-sizing: border-box;
            border-right: 2px solid #0a0a0a;
        }
        .guide-body {
            display: flex;
            margin-top: 2px;
        }
        .guide-channel-list {
            flex-shrink: 0;
            width: 72px;
            position: sticky;
            left: 0;
            z-index: 20;
            background: #0a0a0a;
        }
        .guide-channel-item {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2px;
            padding: 0.25rem;
            cursor: pointer;
            transition: background-color 0.15s;
            background: #111;
            margin-right: 2px;
            box-sizing: border-box;
        }
        .guide-channel-item:hover {
            background: #1a1a1a;
        }
        .guide-channel-item.selected {
            background: #252525;
        }
        .guide-channel-item img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }
        .guide-programmes {
            flex-shrink: 0;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .guide-programme-row {
            display: flex;
            height: 56px;
        }
        .guide-programme-block {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 0.5rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            background: #111;
            transition: background-color 0.15s;
            z-index: 1;
            box-sizing: border-box;
            border-right: 2px solid #0a0a0a;
            flex-shrink: 0;
        }
        .guide-programme-block:hover,
        .guide-programme-block.keyboard-hover {
            background: #2a2a2a;
            z-index: 1;
        }
        .guide-programme-now {
            background: #111;
        }
        .guide-programme-now:hover,
        .guide-programme-now.keyboard-hover {
            background: #2a2a2a;
        }
        .guide-programme-future {
            cursor: pointer;
        }
        .guide-programme-empty {
            background: #111;
            cursor: pointer;
        }
        .guide-programme-empty:hover,
        .guide-programme-empty.keyboard-hover {
            background: #2a2a2a;
        }
        .guide-programme-title {
            font-size: 0.75rem;
            font-weight: 500;
            color: #e5e5e5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.25rem;
        }
        .guide-programme-time {
            font-size: 0.65rem;
            color: #777;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .guide-now-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 1px;
            background: #ffffff;
            z-index: 10;
            pointer-events: none;
        }
        .programme-tooltip {
            position: fixed;
            z-index: 90;
            background: #0f0f0f;
            border: none;
            padding: 0;
            font-size: 0.75rem;
            color: #e5e5e5;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            max-width: 320px;
            word-wrap: break-word;
            display: none;
            white-space: nowrap;
            overflow: hidden;
        }
        .tooltip-preview {
            width: 320px;
            height: 180px;
            object-fit: cover;
            display: block;
            background: #1a1a1a;
        }
        .tooltip-content {
            padding: 0.5rem 0.75rem;
        }
        .tooltip-title {
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 280px;
        }
        .tooltip-time {
            color: #777;
            font-size: 0.65rem;
            white-space: nowrap;
        }
        .schedule-overlay {
            position: fixed;
            inset: 0;
            z-index: 199;
            background: rgba(0, 0, 0, 0.5);
            display: none;
        }
        .schedule-overlay.show {
            display: block;
        }
        .schedule-popup {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            background: #0f0f0f;
            border: none;
            padding: 1.25rem 1.5rem;
            min-width: 340px;
            max-width: 420px;
            display: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .schedule-popup.show {
            display: block;
            animation: popupIn 0.2s ease-out;
        }
        @keyframes popupIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        .schedule-popup-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.375rem;
        }
        .schedule-popup-subtitle {
            font-size: 0.75rem;
            color: #777;
            margin-bottom: 1rem;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .schedule-popup-btn {
            width: 100%;
            padding: 0.625rem;
            background: #ffffff;
            color: #0a0a0a;
            border: none;
            font-size: 0.8125rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s;
            letter-spacing: 0.01em;
        }
        .schedule-popup-btn:hover {
            background: #e0e0e0;
        }
        .schedule-popup-progress {
            height: 2px;
            background: #1a1a1a;
            margin-top: 0.75rem;
            overflow: hidden;
        }
        .schedule-popup-progress-fill {
            height: 100%;
            background: #555;
            width: 100%;
            transition: width 0.1s linear;
        }
        .login-modal {
            position: fixed;
            inset: 0;
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
        }
        .login-modal.show {
            display: flex;
            animation: loginIn 0.2s ease-out;
        }
        @keyframes loginIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .login-box {
            background: #0f0f0f;
            border: none;
            padding: 2rem;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .login-subtitle {
            font-size: 0.75rem;
            color: #777;
            margin-bottom: 1.5rem;
        }
        .google-btn {
            width: 100%;
            padding: 0.75rem;
            background: #fff;
            color: #000;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }
        .google-btn:hover {
            background: #e0e0e0;
        }
        .google-btn svg {
            width: 18px;
            height: 18px;
        }
        .login-error {
            background: #ffebee;
            color: #c62828;
            padding: 0.5rem;
            font-size: 0.75rem;
            margin-bottom: 0.75rem;
            display: none;
            border-radius: 4px;
        }
        .user-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #333;
            cursor: pointer;
            flex-shrink: 0;
            transition: background-color 0.2s;
            margin-left: 0.5rem;
            overflow: hidden;
            border: 2px solid #666;
        }
        .user-badge:hover {
            background: #444;
        }
        .user-badge.free {
            border-color: #888;
        }
        .user-badge.premium {
            border-color: #4caf50;
        }
        .user-badge.lifetime {
            border-color: #ec4899;
        }
        .user-badge img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            pointer-events: none;
        }
        .user-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
            font-weight: 600;
            color: #fff;
            user-select: none;
        }
        .login-icon-btn {
            cursor: pointer;
            color: #666;
            font-size: 1rem;
            transition: color 0.2s;
            flex-shrink: 0;
            margin-left: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
        }
        .login-icon-btn:hover {
            color: #ffffff;
        }
        .premium-icon-btn {
            cursor: pointer;
            color: #666;
            font-size: 1rem;
            transition: color 0.2s;
            flex-shrink: 0;
            margin-left: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
        }
        .premium-icon-btn:hover {
            color: #ffffff;
        }
        .premium-tag {
            display: inline-block;
            padding: 0.125rem 0.375rem;
            border-radius: 3px;
            font-size: 0.5625rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-left: 0.375rem;
            vertical-align: middle;
            line-height: 1.4;
        }
        .premium-tag.free {
            background: #2a2a2a;
            color: #999;
        }
        .premium-tag.premium {
            background: #1a3a1a;
            color: #4caf50;
        }
        .premium-tag.lifetime {
            background: #3a1a2a;
            color: #ec4899;
        }
        .profile-popup {
            position: fixed;
            z-index: 250;
            background: #0f0f0f;
            border: none;
            padding: 1rem;
            min-width: 240px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            display: none;
            animation: profileIn 0.15s ease-out;
        }
        .profile-popup.show {
            display: block;
        }
        @keyframes profileIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .profile-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        .profile-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .profile-avatar-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.125rem;
            font-weight: 600;
            color: #fff;
        }
        .profile-details {
            flex: 1;
            min-width: 0;
        }
        .profile-name {
            font-size: 0.875rem;
            font-weight: 500;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }
        .profile-email {
            font-size: 0.75rem;
            color: #777;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .profile-logout-btn {
            width: 100%;
            padding: 0.625rem;
            background: #ffffff;
            color: #0a0a0a;
            border: none;
            cursor: pointer;
            font-size: 0.8125rem;
            font-weight: 600;
            transition: background-color 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            letter-spacing: 0.01em;
        }
        .profile-logout-btn:hover {
            background: #e0e0e0;
        }
        .giftcard-modal {
            position: fixed;
            inset: 0;
            z-index: 350;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
        }
        .giftcard-modal.show {
            display: flex;
            animation: loginIn 0.2s ease-out;
        }
        .giftcard-box {
            background: #0f0f0f;
            border: none;
            padding: 2rem;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .giftcard-subtitle {
            font-size: 0.75rem;
            color: #777;
            margin-bottom: 1.5rem;
        }
        .giftcard-input {
            width: 100%;
            padding: 0.75rem;
            background: transparent;
            border: none;
            border-bottom: 1px solid #333;
            color: #fff;
            margin-bottom: 1.5rem;
            outline: none;
            font-size: 0.875rem;
            text-align: center;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: border-color 0.2s;
        }
        .giftcard-input:focus {
            border-bottom-color: #555;
        }
        .giftcard-input::placeholder {
            color: #666;
            letter-spacing: 0.05em;
        }
        .giftcard-btn {
            width: 100%;
            padding: 0.75rem;
            background: #fff;
            color: #000;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }
        .giftcard-btn:hover {
            background: #e0e0e0;
        }
        .giftcard-message {
            padding: 0.5rem;
            font-size: 0.75rem;
            margin-bottom: 0.75rem;
            display: none;
            border-radius: 4px;
        }
        .giftcard-message.success {
            background: #e8f5e9;
            color: #2e7d32;
            display: block;
        }
        .giftcard-message.error {
            background: #ffebee;
            color: #c62828;
            display: block;
        }
    </style>
</head>
<body>

    <div id="loadingScreen">
        <div class="loading-content">
            <img src="https://orbitcloud.vaneltonmedia.com/fb8b4ce080e59805fcd247391a5574e8/icon-original.png" alt="seadog logo" class="loading-logo-img">
        </div>
    </div>

    <header>
        <div class="header-container">
            <div class="header-left">
                <h1 class="pirate-title">seadog</h1>
            </div>
            <div class="search-container" id="searchContainer">
                <i class="fa-solid fa-magnifying-glass search-icon" id="searchIcon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Buscar por canal ou programa">
            </div>
        </div>
    </header>

    <main id="mainScroll">
        <div id="content"></div>
    </main>

    <div id="tooltip" class="programme-tooltip"></div>

    <div id="scheduleOverlay" class="schedule-overlay"></div>

    <div id="schedulePopup" class="schedule-popup">
        <div class="schedule-popup-title" id="schedulePopupTitle">Agendar programação?</div>
        <div class="schedule-popup-subtitle" id="schedulePopupSubtitle"></div>
        <button class="schedule-popup-btn" id="schedulePopupBtn">Agendar</button>
        <div class="schedule-popup-progress">
            <div class="schedule-popup-progress-fill" id="schedulePopupProgress"></div>
        </div>
    </div>

    <div id="player" class="fixed inset-0 z-50 hidden bg-black">
        <div class="relative h-full">
            <div class="absolute inset-0 z-[5]" id="iframeBlocker"></div>
            <iframe id="modalIframe" class="w-full h-full relative z-[1]" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            <div class="player-header" id="playerHeader">
                <div class="player-header-content">
                    <div class="flex items-center gap-3 min-w-0">
                        <img id="modalLogo" src="" alt="" class="modal-logo-img w-10 h-10 rounded bg-transparent flex-shrink-0">
                        <div class="space-y-0.5 min-w-0">
                            <span id="modalName" class="text-sm font-medium block truncate"></span>

        async function handleRedeemGiftCard() {
            if (!currentUser) {
                showGiftCardMessage('Você precisa estar logado para resgatar um gift card', 'error')
                return
            }
            
            const code = document.getElementById('giftcardInput').value.trim()
            
            if (!code) {
                showGiftCardMessage('Por favor, insira o código do gift card', 'error')
                return
            }
            
            const formattedCode = code.toUpperCase().replace(/\s+/g, '')
            
            if (!formattedCode.match(/^[A-Z0-9]{5}-[A-Z0-9]{5}-[A-Z0-9]{5}-[A-Z0-9]{5}-[A-Z0-9]{5}$/)) {
                showGiftCardMessage('Formato de código inválido', 'error')
                return
            }
            
            const { data, error } = await supabaseClient.rpc('redeem_gift_card', {
                p_code: formattedCode,
                p_user_id: currentUser.id
            })
            
            if (error) {
                showGiftCardMessage('Erro ao resgatar: ' + error.message, 'error')
                return
            }
            
            if (data && data.length > 0) {
                const result = data[0]
                if (result.success) {
                    if (result.expires_at) {
                        const expiryDate = new Date(result.expires_at)
                        showGiftCardMessage(`${result.message}! Premium válido até ${expiryDate.toLocaleDateString('pt-BR')}`, 'success')
                    } else {
                        showGiftCardMessage(result.message, 'success')
                    }
                    document.getElementById('giftcardInput').value = ''
                    updateUserInterface()
                } else {
                    showGiftCardMessage(result.message, 'error')
                }
            }
        }

            if (subscription && subscription.expires_at) {

                e.preventDefault();
                searchInput.classList.add('active');
                searchInput.focus();
                return;
            }

            if (schedulePopup.classList.contains('show')) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    schedulePopupBtn.click();

                    e.preventDefault();
                    hideSchedulePopup();
                }
                return;

            if (playerOpen) {
                showPlayerHeader();
                switch(e.key) {
                    case 'Escape':
                    case 'Backspace':
                        closePlayer();
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        navigatePlayer('left');
                        break;
                    case 'ArrowRight':

                        navigatePlayer('right');
                        break;
                    case 'ArrowUp':

                        navigatePlayer('up');

                        navigatePlayer('down');
                        break;
                    case 'f':

                        break;

                if (!['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp', 'Enter'].includes(e.key)) return;

                if (e.key === 'Enter') {
                    if (searchInput.classList.contains('active')) {

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp * 1000);
            return date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        function truncateText(text, maxLength) {
            if (!text) return '';
            return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
        }

        function buildCategories() {
            categories = {};
            allChannels.forEach(channel => {
                const genre = channel.genre || 'general';
                if (!categories[genre]) categories[genre] = [];
                categories[genre].push(channel);
            });
        }

        function getGuideInfo(slug) {
            return guideData[slug] || null;
        }

        function getGuideProgrammes(channel) {
            const guide = getGuideInfo(channel.slug);
            if (!guide) return [];
            
            const programmes = [];
            
            if (guide.now_playing_title && guide.now_playing_next_programmes?.length > 0) {
                const nextProg = guide.now_playing_next_programmes[0];
                const now = Math.floor(Date.now() / 1000);
                
                programmes.push({
                    title: guide.now_playing_title,
                    start_timestamp: now,
                    end_timestamp: nextProg.start_timestamp,
                    isNow: true,
                    progress: guide.now_playing_progress || 0
                });
            }
            
            if (guide.now_playing_next_programmes) {
                guide.now_playing_next_programmes.forEach(prog => {
                    programmes.push({ ...prog, isNow: false });
                });
            }
            
            return programmes;
        }

                if (isNow && channelSlug) {
                    const previewUrl = getPreviewUrl(channelSlug);
                    tooltipContent += `<img src="${previewUrl}" alt="Preview" class="tooltip-preview" onerror="this.style.display='none'">`;
                }
                
                tooltipContent += '<div class="tooltip-content">';
                if (title) {
                    tooltipContent += `<div class="tooltip-title">${title}</div>`;
                }
                if (startTime && endTime) {
                    tooltipContent += `<div class="tooltip-time">${startTime} - ${endTime}</div>`;
                } else if (startTime) {
                    tooltipContent += `<div class="tooltip-time">${startTime}</div>`;
                }
                tooltipContent += '</div>';
                
                tooltip.innerHTML = tooltipContent;
                tooltip.style.display = 'block';
                
                const tooltipRect = tooltip.getBoundingClientRect();
                
                let left = rect.left;
                let top = rect.top - tooltipRect.height - 8;
                
                if (left + tooltipRect.width > window.innerWidth) {
                    left = window.innerWidth - tooltipRect.width - 8;
                }
                
                if (left < 0) {
                    left = 8;
                }
                
                if (top < 0) {
                    top = rect.bottom + 8;
                }
                
                tooltip.style.left = left + 'px';
                tooltip.style.top = top + 'px';
            }, 1000);
        }

        function hideTooltip() {
            clearTimeout(tooltipTimeout);
            tooltip.style.display = 'none';
        }

        function showSchedulePopup(title, subtitle, actionText, actionCallback) {
            schedulePopupTitle.textContent = title;
            schedulePopupSubtitle.textContent = subtitle;
            schedulePopupBtn.textContent = actionText;
            schedulePopup.classList.add('show');
            document.getElementById('scheduleOverlay').classList.add('show');
            schedulePopupProgress.style.width = '100%';
            
            clearTimeout(popupTimeout);
            clearInterval(popupProgressInterval);
            
            let progress = 100;
            const totalDuration = 5000;
            const interval = 50;
            const decrement = (100 / totalDuration) * interval;
            
            popupProgressInterval = setInterval(() => {
                progress -= decrement;
                schedulePopupProgress.style.width = progress + '%';
                if (progress <= 0) {
                    clearInterval(popupProgressInterval);
                    hideSchedulePopup();
                }
            }, interval);
            
            schedulePopupBtn.onclick = () => {
                clearInterval(popupProgressInterval);
                hideSchedulePopup();
                actionCallback();
            };
            
            popupTimeout = setTimeout(() => {
                hideSchedulePopup();
            }, totalDuration);
        }

        function hideSchedulePopup() {
            schedulePopup.classList.remove('show');
            document.getElementById('scheduleOverlay').classList.remove('show');
            clearTimeout(popupTimeout);
            clearInterval(popupProgressInterval);
        }

        async function handleScheduleClick(channelIndex, blockIndex) {
            if (!currentUser) {
                showLoginModal()
                return
            }
            
            const blockData = blocksData.find(b => b.channelIndex === channelIndex && b.blockIndex === blockIndex);
            if (!blockData) return;
            
            if (blockData.isNow) {
                openPlayerByIndex(channelIndex);
                return;
            }
            
            const channel = flatChannels[channelIndex];
            const guide = getGuideInfo(channel.slug);
            if (!guide) return;
            
            const prog = guide.now_playing_next_programmes?.[blockIndex - 1];
            if (!prog) return;
            
            const existingSchedule = schedules.find(s => 
                s.start_timestamp === prog.start_timestamp && 
                s.end_timestamp === prog.end_timestamp &&
                s.channelIndex !== channelIndex
            );
            
            if (existingSchedule) {
                showSchedulePopup(
                    'Substituir agendamento?',
                    `${prog.title} às ${formatTime(prog.start_timestamp)}`,
                    'Substituir',
                    async () => {
                        await supabaseClient
                            .from('schedules')
                            .delete()
                            .eq('id', existingSchedule.id)
                        
                        const { error: insertError } = await supabaseClient
                            .from('schedules')
                            .insert({
                                user_id: currentUser.id,
                                channel_index: channelIndex,
                                title: prog.title,
                                start_timestamp: prog.start_timestamp,
                                end_timestamp: prog.end_timestamp
                            })
                        
                        if (!insertError) {
                            await loadUserSchedules()
                        }
                    }
                );
            } else {
                showSchedulePopup(
                    'Agendar programação?',
                    `${prog.title} às ${formatTime(prog.start_timestamp)}`,
                    'Agendar',
                    async () => {
                        const { error: insertError } = await supabaseClient
                            .from('schedules')
                            .insert({
                                user_id: currentUser.id,
                                channel_index: channelIndex,
                                title: prog.title,
                                start_timestamp: prog.start_timestamp,
                                end_timestamp: prog.end_timestamp
                            })
                        
                        if (!insertError) {
                            await loadUserSchedules()
                        }
                    }
                );
            }
        }

        function checkSchedules() {
            if (!currentUser) return
            
            const now = Math.floor(Date.now() / 1000);
            
            schedules.forEach((schedule, index) => {
                const timeUntilStart = schedule.start_timestamp - now;
                
                if (timeUntilStart <= 300 && timeUntilStart > 0 && !schedule.notified) {
                    schedule.notified = true;
                    const channel = flatChannels[schedule.channelIndex];
                    showSchedulePopup(
                        'Programação começando',
                        `${schedule.title} em ${channel?.name || ''}`,
                        'Assistir agora',
                        async () => {
                            openPlayerByIndex(schedule.channelIndex);
                            await supabaseClient
                                .from('schedules')
                                .delete()
                                .eq('id', schedule.id)
                            await loadUserSchedules()
                        }
                    );
                } else if (timeUntilStart <= -300) {
                    supabaseClient
                        .from('schedules')
                        .delete()
                        .eq('id', schedule.id)
                        .then(() => loadUserSchedules())
                }
            });
        }

        setInterval(checkSchedules, 1000);

        function highlightRow(channelIndex) {
            document.querySelectorAll('.guide-channel-item').forEach((el, i) => {
                if (i === channelIndex) {
                    el.classList.add('selected');
                } else {
                    el.classList.remove('selected');
                }
            });
            
            document.querySelectorAll('.guide-programme-row').forEach((el, i) => {
                if (i === channelIndex) {
                    el.classList.add('selected');
                } else {
                    el.classList.remove('selected');
                }
            });
        }

        function selectBlock(channelIndex, blockIndex, source) {
            selectedChannelIndex = channelIndex;
            selectedBlockIndex = blockIndex;
            
            document.querySelectorAll('.guide-programme-block').forEach(el => {
                el.classList.remove('keyboard-hover');
            });
            
            const blocks = document.querySelectorAll(`.guide-programme-row[data-channel-index="${channelIndex}"] .guide-programme-block`);
            if (blocks[blockIndex]) {
                if (source === 'keyboard') {
                    blocks[blockIndex].classList.add('keyboard-hover');
                    
                    const titleElement = blocks[blockIndex].querySelector('.guide-programme-title');
                    if (titleElement) {
                        const fullText = titleElement.textContent;
                        const blockData = blocksData.find(b => b.channelIndex === channelIndex && b.blockIndex === blockIndex);
                        
                        if (blockData && fullText !== 'Sem programação') {
                            const channel = flatChannels[channelIndex];
                            showTooltip(
                                blocks[blockIndex], 
                                fullText, 
                                formatTime(blockData.startTime), 
                                formatTime(blockData.endTime),
                                channel?.slug,
                                blockData.isNow
                            );
                        } else {
                            hideTooltip();
                        }
                    }
                }
                
                if (source === 'keyboard') {
                    const row = blocks[blockIndex].closest('.guide-programme-row');
                    if (row) {
                        const guideHeader = row.closest('.guide-wrapper').querySelector('.guide-time-header');
                        const headerHeight = guideHeader ? guideHeader.offsetHeight : 0;
                        const rowTop = row.offsetTop;
                        mainScroll.scrollTop = rowTop - headerHeight;
                    }
                }
            }
            
            highlightRow(channelIndex);
        }

        function handleChannelHover(element, channelIndex) {
            if (usingKeyboard || playerOpen) return;
            
            const channel = flatChannels[channelIndex];
            if (channel) {
                showTooltip(element, channel.name || '', null, null, null, false);
            }
        }

        function handleChannelLeave() {
            if (!usingKeyboard) {
                hideTooltip();
            }
        }

        function handleBlockHover(element, channelIndex, blockIndex) {
            if (usingKeyboard || playerOpen) return;
            
            selectBlock(channelIndex, blockIndex, 'mouse');
            
            const titleElement = element.querySelector('.guide-programme-title');
            if (titleElement) {
                const fullText = titleElement.textContent;
                const blockData = blocksData.find(b => b.channelIndex === channelIndex && b.blockIndex === blockIndex);
                
                if (blockData && fullText !== 'Sem programação') {
                    const channel = flatChannels[channelIndex];
                    showTooltip(
                        element, 
                        fullText, 
                        formatTime(blockData.startTime), 
                        formatTime(blockData.endTime),
                        channel?.slug,
                        blockData.isNow
                    );
                } else {
                    hideTooltip();
                }
            }
        }

        function handleBlockLeave() {
            if (!usingKeyboard) {
                hideTooltip();
            }
        }

        function navigateGrid(direction) {
            if (flatChannels.length === 0) return;
            
            usingKeyboard = true;
            hideTooltip();
            
            if (direction === 'up') {
                selectedChannelIndex = (selectedChannelIndex - 1 + flatChannels.length) % flatChannels.length;
                selectedBlockIndex = 0;
            } else if (direction === 'down') {
                selectedChannelIndex = (selectedChannelIndex + 1) % flatChannels.length;
                selectedBlockIndex = 0;
            } else if (direction === 'left') {
                const blocks = document.querySelectorAll(`.guide-programme-row[data-channel-index="${selectedChannelIndex}"] .guide-programme-block`);
                if (selectedBlockIndex > 0) {
                    selectedBlockIndex--;
                } else {
                    selectedBlockIndex = blocks.length - 1;
                }
            } else if (direction === 'right') {
                const blocks = document.querySelectorAll(`.guide-programme-row[data-channel-index="${selectedChannelIndex}"] .guide-programme-block`);
                if (selectedBlockIndex < blocks.length - 1) {
                    selectedBlockIndex++;
                } else {
                    selectedBlockIndex = 0;
                }
            }
            
            selectBlock(selectedChannelIndex, selectedBlockIndex, 'keyboard');
            
            if (direction === 'left' || direction === 'right') {
                const block = document.querySelector(`.guide-programme-row[data-channel-index="${selectedChannelIndex}"] .guide-programme-block:nth-child(${selectedBlockIndex + 1})`);
                if (block) {
                    const mainRect = mainScroll.getBoundingClientRect();
                    const blockRect = block.getBoundingClientRect();
                    
                    if (blockRect.left < mainRect.left || blockRect.right > mainRect.right) {
                        mainScroll.scrollLeft += blockRect.left - mainRect.left - 100;
                    }
                }
            }
        }

        function renderGuide() {
            if (!allChannels || allChannels.length === 0) {
                content.innerHTML = '<div class="text-center py-20 text-gray-600">Nenhum canal encontrado</div>';
                return;
            }
            
            buildCategories();
            
            const query = searchInput.value.toLowerCase().trim();
            
            const now = new Date();
            const currentHour = now.getHours();
            const startHour = currentHour;
            const totalHours = 24;
            
            const categoryOrder = ['general', '24h', 'movies', 'series', 'sports', 'espn', 'kids', 'music', 'documentary', 'entertainment', 'variety', 'news', 'religion', 'adult'];
            const categoryKeys = categoryOrder.filter(key => categories[key]?.length > 0);
            
            flatChannels = [];
            categoryKeys.forEach(key => {
                categories[key].forEach(channel => {
                    if (!query) {
                        flatChannels.push(channel);
                    } else {
                        const channelName = (channel.name || '').toLowerCase();
                        const guide = getGuideInfo(channel.slug);
                        let programmeTitles = '';
                        
                        if (guide) {
                            if (guide.now_playing_title) {
                                programmeTitles += guide.now_playing_title.toLowerCase() + ' ';
                            }
                            if (guide.now_playing_next_programmes) {
                                guide.now_playing_next_programmes.forEach(prog => {
                                    if (prog.title) {
                                        programmeTitles += prog.title.toLowerCase() + ' ';
                                    }
                                });
                            }
                        }
                        
                        if (channelName.includes(query) || programmeTitles.includes(query)) {
                            flatChannels.push(channel);
                        }
                    }
                });
            });
            
            if (flatChannels.length === 0) {
                content.innerHTML = '<div class="text-center py-20 text-gray-600">Nenhum canal encontrado</div>';
                return;
            }
            
            let hoursHtml = '';
            for (let i = 0; i < totalHours; i++) {
                const hour = (startHour + i) % 24;
                const hourStr = String(hour).padStart(2, '0') + ':00';
                
                hoursHtml += `
                    <div class="guide-hour">
                        ${hourStr}
                    </div>
                `;
            }
            
            let channelListHtml = '';
            let programmesHtml = '';
            
            const startOfDay = new Date(now);
            startOfDay.setHours(startHour, 0, 0, 0);
            guideStartTimestamp = Math.floor(startOfDay.getTime() / 1000);
            guideEndTimestamp = guideStartTimestamp + totalHours * 3600;
            
            blocksData = [];
            
            const nowTimestamp = Math.floor(Date.now() / 1000);
            
            flatChannels.forEach((channel, channelIndex) => {
                const logo = getProxiedLogo(channel.logo || channel.cover);
                const programmes = getGuideProgrammes(channel);
                
                channelListHtml += `
                    <div class="guide-channel-item" 
                         onclick='openPlayerByIndex(${channelIndex})' 
                         onmouseenter='handleChannelHover(this, ${channelIndex})'
                         onmouseleave='handleChannelLeave()'>
                        <img src="${logo}" alt="${channel.name}" onerror="this.style.display='none'">
                    </div>
                `;
                
                let rowHtml = `<div class="guide-programme-row" data-channel-index="${channelIndex}">`;
                
                let currentTime = guideStartTimestamp;
                let programmeIndex = 0;
                let blockIndex = 0;
                
                while (currentTime < guideEndTimestamp) {
                    const prog = programmes[programmeIndex];
                    
                    if (!prog) {
                        const width = Math.round(((guideEndTimestamp - currentTime) / 3600) * HOUR_WIDTH);
                        rowHtml += `
                            <div class="guide-programme-block guide-programme-empty" 
                                 style="width: ${width}px; min-width: ${width}px;"
                                 onclick='openPlayerByIndex(${channelIndex})'
                                 onmouseenter='handleBlockHover(this, ${channelIndex}, ${blockIndex})'
                                 onmouseleave='handleBlockLeave()'>
                            </div>
                        `;
                        blocksData.push({ 
                            channelIndex, 
                            blockIndex, 
                            isNow: false, 
                            isEmpty: true,
                            startTime: currentTime,
                            endTime: guideEndTimestamp
                        });
                        break;
                    }
                    
                    let blockStart;
                    let blockEnd;
                    
                    if (programmeIndex === 0 && prog.isNow) {
                        blockStart = currentTime;
                        blockEnd = Math.min(prog.end_timestamp || guideEndTimestamp, guideEndTimestamp);
                    } else {
                        blockStart = Math.max(prog.start_timestamp || currentTime, currentTime);
                        blockEnd = Math.min(prog.end_timestamp || blockStart + 3600, guideEndTimestamp);
                    }
                    
                    if (blockEnd <= blockStart) {
                        programmeIndex++;
                        continue;
                    }
                    
                    const duration = blockEnd - blockStart;
                    const width = Math.round((duration / 3600) * HOUR_WIDTH);
                    
                    const isNow = blockStart <= nowTimestamp && blockEnd > nowTimestamp;
                    const isFuture = blockStart > nowTimestamp;
                    
                    const clickHandler = isNow 
                        ? `onclick='openPlayerByIndex(${channelIndex})'` 
                        : isFuture 
                            ? `onclick='handleScheduleClick(${channelIndex}, ${blockIndex})'` 
                            : '';
                    
                    const futureClass = isFuture ? 'guide-programme-future' : '';
                    const nowClass = isNow ? 'guide-programme-now' : '';
                    
                    rowHtml += `
                        <div class="guide-programme-block ${nowClass} ${futureClass}" 
                             style="width: ${width}px; min-width: ${width}px;"
                             ${clickHandler}
                             onmouseenter='handleBlockHover(this, ${channelIndex}, ${blockIndex})'
                             onmouseleave='handleBlockLeave()'>
                            <span class="guide-programme-title">${prog.title || ''}</span>
                            <span class="guide-programme-time">${formatTime(blockStart)}</span>
                        </div>
                    `;
                    
                    blocksData.push({ 
                        channelIndex, 
                        blockIndex, 
                        isNow,
                        startTime: blockStart,
                        endTime: blockEnd
                    });
                    
                    currentTime = blockEnd;
                    programmeIndex++;
                    blockIndex++;
                }
                
                rowHtml += '</div>';
                programmesHtml += rowHtml;
            });
            
            content.innerHTML = `
                <div class="guide-wrapper">
                    <div class="guide-channels">
                        <div class="guide-time-header">
                            <div class="guide-time-header-spacer"></div>
                            <div class="guide-time-header-hours">${hoursHtml}</div>
                        </div>
                        <div class="guide-body">
                            <div class="guide-channel-list">${channelListHtml}</div>
                            <div class="guide-programmes">
                                <div class="guide-now-line" id="nowLine"></div>
                                ${programmesHtml}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            updateNowLine();
            
            selectedChannelIndex = 0;
            selectedBlockIndex = 0;
            
            const urlParams = new URLSearchParams(window.location.search);
            const channelParam = urlParams.get('c');
            if (channelParam) {
                const channelSlug = channelParam.toLowerCase();
                const channelIndex = flatChannels.findIndex(c => (c.slug || c.name || '').toLowerCase() === channelSlug);
                if (channelIndex >= 0) {
                    setTimeout(() => openPlayerByIndex(channelIndex), 500);
                }
            }
        }

        function updateNowLine() {
            const nowLine = document.getElementById('nowLine');
            if (!nowLine || !guideStartTimestamp) return;
            
            const nowTimestamp = Math.floor(Date.now() / 1000);
            const elapsedSeconds = nowTimestamp - guideStartTimestamp;
            const nowPosition = Math.round((elapsedSeconds / 3600) * HOUR_WIDTH);
            
            nowLine.style.left = nowPosition + 'px';
        }

        function openPlayerByIndex(index) {
            const channel = flatChannels[index];
            if (!channel) return;
            
            selectedChannelIndex = index;
            playerOpen = true;
            hideTooltip();

            iframe.src = channel.url + (channel.url.includes('?') ? '&' : '?') + 'autoplay=1';
            modalLogo.src = getProxiedLogo(channel.logo || channel.cover);
            modalName.textContent = channel.name;
            
            const guide = getGuideInfo(channel.slug);
            modalNowPlaying.textContent = guide?.now_playing_title || '';
            
            player.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            showPlayerHeader();
            
            const channelSlug = channel.slug || channel.name || '';
            const newUrl = window.location.pathname + '?c=' + encodeURIComponent(channelSlug.toLowerCase());
            history.pushState({ playerOpen: true, channel: channelSlug.toLowerCase() }, '', newUrl);
        }

        function showPlayerHeader() {
            playerHeader.classList.remove('hidden-header');
            clearTimeout(headerTimeout);
            headerTimeout = setTimeout(() => playerHeader.classList.add('hidden-header'), 10000);
        }

        function closePlayer() {
            playerOpen = false;
            player.classList.add('hidden');
            iframe.src = '';
            document.body.style.overflow = '';
            playerHeader.classList.remove('hidden-header');
            hideTooltip();
            
            const newUrl = window.location.pathname;
            history.pushState({ playerOpen: false }, '', newUrl);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                if (player.requestFullscreen) {
                    player.requestFullscreen();
                    fullscreenBtn.querySelector('i').className = 'fa-solid fa-compress';
                    fullscreenBtn.title = 'Sair da tela cheia';
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    fullscreenBtn.querySelector('i').className = 'fa-solid fa-expand';
                    fullscreenBtn.title = 'Maximizar';
                }
            }
            showPlayerHeader();
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                fullscreenBtn.querySelector('i').className = 'fa-solid fa-expand';
                fullscreenBtn.title = 'Maximizar';
            }
        });

        window.addEventListener('popstate', () => {
            if (playerOpen) {
                playerOpen = false;
                player.classList.add('hidden');
                iframe.src = '';
                document.body.style.overflow = '';
                playerHeader.classList.remove('hidden-header');
                hideTooltip();
            }
        });

        function navigatePlayer(direction) {
            if (flatChannels.length === 0) return;
            
            if (direction === 'left' || direction === 'up') {
                selectedChannelIndex = (selectedChannelIndex - 1 + flatChannels.length) % flatChannels.length;
            } else if (direction === 'right' || direction === 'down') {
                selectedChannelIndex = (selectedChannelIndex + 1) % flatChannels.length;
            }
            
            openPlayerByIndex(selectedChannelIndex);
        }

        player.addEventListener('mousemove', () => {
            if (playerOpen) showPlayerHeader();
        });

        player.addEventListener('touchstart', (e) => {
            if (playerOpen) {
                showPlayerHeader()
                
                touchStartX = e.touches[0].clientX
                touchStartY = e.touches[0].clientY
                touchEndX = e.touches[0].clientX
                touchEndY = e.touches[0].clientY
                isSwiping = false
            }
        }, { passive: true });

        player.addEventListener('touchmove', (e) => {
            if (!playerOpen) return
            
            touchEndX = e.touches[0].clientX
            touchEndY = e.touches[0].clientY
            
            const deltaX = touchEndX - touchStartX
            const deltaY = touchEndY - touchStartY
            
            if (Math.abs(deltaX) > 10 || Math.abs(deltaY) > 10) {
                isSwiping = true
            }
        }, { passive: true });

        player.addEventListener('touchend', () => {
            if (!playerOpen || !isSwiping) {
                isSwiping = false
                touchStartX = 0
                touchStartY = 0
                touchEndX = 0
                touchEndY = 0
                return
            }
            
            const deltaX = touchEndX - touchStartX
            const deltaY = touchEndY - touchStartY
            
            const minSwipeDistance = 50
            
            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (Math.abs(deltaX) > minSwipeDistance) {
                    if (deltaX > 0) {
                        navigatePlayer('left')
                    } else {
                        navigatePlayer('right')
                    }
                }
            } else {
                if (Math.abs(deltaY) > minSwipeDistance) {
                    if (deltaY > 0) {
                        navigatePlayer('up')
                    } else {
                        navigatePlayer('down')
                    }
                }
            }
            
            isSwiping = false
            touchStartX = 0
            touchStartY = 0
            touchEndX = 0
            touchEndY = 0
            
            showPlayerHeader()
        }, { passive: true });

        document.addEventListener('mousemove', () => {
            usingKeyboard = false;
        });

        async function loadGuide() {
            try {
                const res = await fetch(GUIDE_API);
                const data = await res.json();
                if (data.success && data.data) {
                    guideData = {};
                    data.data.forEach(channel => {
                        guideData[channel.id] = channel;
                    });
                }
            } catch {
                
            }
        }

        async function loadChannels() {
            try {
                const { data: channelsData, error: channelsError } = await supabaseClient
                    .from('channels')
                    .select('*')
                    .order('name');
                
                if (channelsError) {
                    throw channelsError;
                }
                
                if (channelsData && channelsData.length > 0) {
                    allChannels = channelsData;
                } else {
                    allChannels = [];
                }
                
                await loadGuide();
                renderGuide();
                hideLoadingScreen();
            } catch (error) {
                hideLoadingScreen();
                content.innerHTML = `
                    <div class="text-center py-20 text-gray-600">
                        <i class="fa-solid fa-exclamation-circle text-2xl mb-3"></i>
                        <p class="text-sm">Erro ao carregar canais</p>
                        <button onclick="loadChannels()" class="mt-3 text-gray-400 hover:text-gray-300 text-sm underline">
                            Tentar novamente
                        </button>
                    </div>
                `;
            }
        }

        window.addEventListener('beforeunload', () => {
            if (tooltipTimeout) clearTimeout(tooltipTimeout);
        });

        loadChannels();
    </script>
</body>
</html>
