<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>seadog</title>
    <link rel="icon" type="image/png" href="https://orbitcloud.vaneltonmedia.com/fb8b4ce080e59805fcd247391a5574e8/icon-w.png" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" href="https://orbitcloud.vaneltonmedia.com/fb8b4ce080e59805fcd247391a5574e8/icon-d.png" media="(prefers-color-scheme: light)">
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pirata+One&family=Inter:wght@300;400;500;600&display=swap');
        * {
            font-family: 'Inter', sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        img {
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
            pointer-events: none;
        }
        body {
            background: #0a0a0a;
            color: #e5e5e5;
            overflow: hidden;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        .pirate-title {
            font-family: 'Pirata One', cursive;
            font-size: 2rem;
            letter-spacing: 0.02em;
            color: #ffffff;
            text-transform: lowercase;
        }
        header {
            background: #0a0a0a;
            flex-shrink: 0;
            z-index: 40;
        }
        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
        }
        .header-left {
            display: flex;
            align-items: center;
        }
        .search-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .search-icon {
            cursor: pointer;
            color: #666;
            font-size: 1rem;
            flex-shrink: 0;
            transition: color 0.2s;
        }
        .search-icon:hover {
            color: #ffffff;
        }
        .search-input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.875rem;
            width: 0;
            opacity: 0;
            transition: width 0.3s ease, opacity 0.3s ease;
            pointer-events: none;
        }
        .search-input.active {
            width: 200px;
            opacity: 1;
            pointer-events: auto;
        }
        .search-input::placeholder {
            color: #666;
        }
        #mainScroll {
            flex: 1;
            overflow: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-behavior: smooth;
        }
        #mainScroll::-webkit-scrollbar {
            display: none;
        }
        .player-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent);
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
        }
        .player-header.hidden-header {
            opacity: 0;
            transform: translateY(-100%);
            pointer-events: none;
        }
        .player-header > * {
            pointer-events: auto;
        }
        .minimize-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background-color 0.2s;
        }
        .minimize-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .channel-logo-img {
            object-fit: contain !important;
            background: transparent !important;
        }
        .modal-logo-img {
            object-fit: contain !important;
            background: transparent !important;
        }
        #loadingScreen {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
        }
        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .loading-logo-img {
            width: 72px;
            height: 72px;
            object-fit: contain;
        }
        .loading-content {
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        .guide-wrapper {
            display: flex;
            min-width: fit-content;
            position: relative;
            padding: 0;
        }
        .guide-channels {
            flex-shrink: 0;
            z-index: 10;
        }
        .guide-time-header {
            display: flex;
            height: 40px;
            position: sticky;
            top: 0;
            z-index: 30;
            background: #0a0a0a;
        }
        .guide-time-header-spacer {
            width: 72px;
            flex-shrink: 0;
            background: #0a0a0a;
            position: sticky;
            left: 0;
            z-index: 25;
        }
        .guide-time-header-hours {
            display: flex;
            flex-shrink: 0;
            position: relative;
        }
        .guide-hour {
            width: 120px;
            flex-shrink: 0;
            display: flex;
            align-items: flex-end;
            padding: 0 0.5rem 0.25rem;
            font-size: 0.75rem;
            color: #666;
            position: relative;
            height: 32px;
            margin-top: 4px;
            box-sizing: border-box;
            border-right: 2px solid #0a0a0a;
        }
        .guide-body {
            display: flex;
            margin-top: 2px;
        }
        .guide-channel-list {
            flex-shrink: 0;
            width: 72px;
            position: sticky;
            left: 0;
            z-index: 20;
            background: #0a0a0a;
        }
        .guide-channel-item {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2px;
            padding: 0.25rem;
            cursor: pointer;
            transition: background-color 0.15s;
            background: #111;
            margin-right: 2px;
            box-sizing: border-box;
        }
        .guide-channel-item:hover {
            background: #1a1a1a;
        }
        .guide-channel-item.selected {
            background: #252525;
        }
        .guide-channel-item img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }
        .guide-programmes {
            flex-shrink: 0;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .guide-programme-row {
            display: flex;
            height: 56px;
        }
        .guide-programme-block {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 0.5rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            background: #111;
            transition: background-color 0.15s;
            z-index: 1;
            box-sizing: border-box;
            border-right: 2px solid #0a0a0a;
            flex-shrink: 0;
        }
        .guide-programme-block:hover,
        .guide-programme-block.keyboard-hover {
            background: #2a2a2a;
            z-index: 1;
        }
        .guide-programme-now {
            background: #111;
        }
        .guide-programme-now:hover,
        .guide-programme-now.keyboard-hover {
            background: #2a2a2a;
        }
        .guide-programme-future {
            cursor: pointer;
        }
        .guide-programme-empty {
            background: #111;
            cursor: pointer;
        }
        .guide-programme-empty:hover,
        .guide-programme-empty.keyboard-hover {
            background: #2a2a2a;
        }
        .guide-programme-title {
            font-size: 0.75rem;
            font-weight: 500;
            color: #e5e5e5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.25rem;
        }
        .guide-programme-time {
            font-size: 0.65rem;
            color: #777;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .guide-now-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 1px;
            background: #ffffff;
            z-index: 10;
            pointer-events: none;
        }
        .programme-tooltip {
            position: fixed;
            z-index: 90;
            background: #0f0f0f;
            border: none;
            padding: 0;
            font-size: 0.75rem;
            color: #e5e5e5;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            max-width: 320px;
            word-wrap: break-word;
            display: none;
            white-space: nowrap;
            overflow: hidden;
        }
        .tooltip-preview {
            width: 320px;
            height: 180px;
            object-fit: cover;
            display: block;
            background: #1a1a1a;
        }
        .tooltip-content {
            padding: 0.5rem 0.75rem;
        }
        .tooltip-title {
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 280px;
        }
        .tooltip-time {
            color: #777;
            font-size: 0.65rem;
            white-space: nowrap;
        }
        .schedule-popup {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            background: #0f0f0f;
            border: none;
            padding: 1.25rem 1.5rem;
            min-width: 340px;
            max-width: 420px;
            display: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }
        .schedule-popup.show {
            display: block;
            animation: popupIn 0.2s ease-out;
        }
        @keyframes popupIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        .schedule-popup-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.375rem;
        }
        .schedule-popup-subtitle {
            font-size: 0.75rem;
            color: #777;
            margin-bottom: 1rem;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .schedule-popup-btn {
            width: 100%;
            padding: 0.625rem;
            background: #ffffff;
            color: #0a0a0a;
            border: none;
            font-size: 0.8125rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s;
            letter-spacing: 0.01em;
        }
        .schedule-popup-btn:hover {
            background: #e0e0e0;
        }
        .schedule-popup-progress {
            height: 2px;
            background: #1a1a1a;
            margin-top: 0.75rem;
            overflow: hidden;
        }
        .schedule-popup-progress-fill {
            height: 100%;
            background: #555;
            width: 100%;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <div id="loadingScreen">
        <div class="loading-content">
            <img src="https://orbitcloud.vaneltonmedia.com/fb8b4ce080e59805fcd247391a5574e8/icon-original.png" alt="seadog logo" class="loading-logo-img">
        </div>
    </div>

    <header>
        <div class="header-container">
            <div class="header-left">
                <h1 class="pirate-title">seadog</h1>
            </div>
            <div class="search-container" id="searchContainer">
                <i class="fa-solid fa-magnifying-glass search-icon" id="searchIcon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Buscar por canal ou programa">
            </div>
        </div>
    </header>

    <main id="mainScroll">
        <div id="content"></div>
    </main>

    <div id="tooltip" class="programme-tooltip"></div>

    <div id="schedulePopup" class="schedule-popup">
        <div class="schedule-popup-title" id="schedulePopupTitle">Agendar programação?</div>
        <div class="schedule-popup-subtitle" id="schedulePopupSubtitle"></div>
        <button class="schedule-popup-btn" id="schedulePopupBtn">Agendar</button>
        <div class="schedule-popup-progress">
            <div class="schedule-popup-progress-fill" id="schedulePopupProgress"></div>
        </div>
    </div>

    <div id="player" class="fixed inset-0 z-50 hidden bg-black">
        <div class="relative h-full">
            <iframe id="modalIframe" class="w-full h-full" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            <div class="player-header flex items-center justify-between px-5 py-4" id="playerHeader">
                <div class="flex items-center gap-3">
                    <img id="modalLogo" src="" alt="" class="modal-logo-img w-10 h-10 rounded bg-transparent flex-shrink-0">
                    <div class="space-y-0.5">
                        <span id="modalName" class="text-sm font-medium block"></span>
                        <span id="modalNowPlaying" class="text-xs text-gray-300 block"></span>
                    </div>
                </div>
                <button onclick="closePlayer()" class="minimize-btn text-white">
                    <i class="fa-solid fa-chevron-down text-xl"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('dragstart', (e) => {
            if (e.target.tagName === 'IMG') e.preventDefault();
        });

        const searchIcon = document.getElementById('searchIcon');
        const searchInput = document.getElementById('searchInput');
        const searchContainer = document.getElementById('searchContainer');

        searchIcon.addEventListener('click', (e) => {
            e.stopPropagation();
            searchInput.classList.toggle('active');
            if (searchInput.classList.contains('active')) {
                searchInput.focus();
            }
        });

        searchInput.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                e.stopPropagation();
                if (flatChannels.length > 0) {
                    selectedChannelIndex = 0;
                    selectedBlockIndex = 0;
                    highlightRow(0);
                    searchInput.blur();
                    searchInput.classList.remove('active');
                }
            }
        });

        document.addEventListener('click', (e) => {
            if (!searchContainer.contains(e.target) && searchInput.classList.contains('active')) {
                searchInput.classList.remove('active');
            }
        });

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                e.preventDefault();
                searchInput.classList.add('active');
                searchInput.focus();
                return;
            }

            if (schedulePopup.classList.contains('show')) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    schedulePopupBtn.click();
                }
                return;
            }
            
            if (playerOpen) {
                showPlayerHeader();
                switch(e.key) {
                    case 'Escape':
                    case 'Backspace':
                        closePlayer();
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        navigatePlayer('left');
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        navigatePlayer('right');
                        break;
                    case 'ArrowUp':
                        e.preventDefault();
                        navigatePlayer('up');
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        navigatePlayer('down');
                        break;
                }
            } else {
                if (!['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp', 'Enter'].includes(e.key)) return;
                
                e.preventDefault();
                
                if (e.key === 'Enter') {
                    if (searchInput.classList.contains('active')) {
                        return;
                    }
                    
                    if (selectedChannelIndex >= 0 && flatChannels[selectedChannelIndex]) {
                        const blockData = blocksData.find(b => b.channelIndex === selectedChannelIndex && b.blockIndex === selectedBlockIndex);
                        if (blockData && (blockData.isNow || blockData.isEmpty)) {
                            openPlayerByIndex(selectedChannelIndex);
                        } else if (blockData) {
                            handleScheduleClick(selectedChannelIndex, selectedBlockIndex);
                        }
                    }
                } else {
                    const direction = e.key.replace('Arrow', '').toLowerCase();
                    navigateGrid(direction);
                }
            }
        });

        searchInput.addEventListener('input', () => {
            renderGuide();
        });

        const CHANNELS_API = 'https://opensheet.elk.sh/13_CjXtUc2AUF5qKE__Z7H_ruu_IjEXmQ0Js3trZ32ZM/1';
        const GUIDE_API = 'https://disret.disret.workers.dev/?url=https://reidosembeds.online/api/channels';
        const PREVIEW_API = 'https://disret.disret.workers.dev/?url=https://img.faz-o-eli.online/';
        const content = document.getElementById('content');
        const mainScroll = document.getElementById('mainScroll');
        const player = document.getElementById('player');
        const iframe = document.getElementById('modalIframe');
        const modalLogo = document.getElementById('modalLogo');
        const modalName = document.getElementById('modalName');
        const modalNowPlaying = document.getElementById('modalNowPlaying');
        const playerHeader = document.getElementById('playerHeader');
        const loadingScreen = document.getElementById('loadingScreen');
        const tooltip = document.getElementById('tooltip');
        const schedulePopup = document.getElementById('schedulePopup');
        const schedulePopupTitle = document.getElementById('schedulePopupTitle');
        const schedulePopupSubtitle = document.getElementById('schedulePopupSubtitle');
        const schedulePopupBtn = document.getElementById('schedulePopupBtn');
        const schedulePopupProgress = document.getElementById('schedulePopupProgress');

        let allChannels = [];
        let guideData = {};
        let categories = {};
        let playerOpen = false;
        let headerTimeout;
        let loadingStartTime = Date.now();
        const MINIMUM_LOADING_TIME = 1500;
        const HOUR_WIDTH = 120;
        let guideStartTimestamp;
        let guideEndTimestamp;
        let flatChannels = [];
        let selectedChannelIndex = 0;
        let selectedBlockIndex = 0;
        let usingKeyboard = false;
        let blocksData = [];
        let schedules = [];
        let popupTimeout = null;
        let popupProgressInterval = null;
        let lastGuideUpdateHour = null;
        let nowLineUpdateInterval = null;
        let guideUpdateInterval = null;
        let tooltipTimeout = null;

        const genreLabels = {
            'general': 'Geral',
            '24h': 'Em looping',
            'movies': 'Filmes',
            'series': 'Séries',
            'sports': 'Esportes',
            'espn': 'Canais ESPN',
            'kids': 'Infantil',
            'music': 'Música',
            'documentary': 'Documentário',
            'entertainment': 'Entretenimento',
            'variety': 'Variedades',
            'news': 'Notícias',
            'religion': 'Religião',
            'adult': 'Adulto'
        };

        function getProxiedLogo(logoUrl) {
            if (!logoUrl) return '';
            return 'https://disret.disret.workers.dev/?url=' + encodeURIComponent(logoUrl);
        }

        function getPreviewUrl(slug) {
            if (!slug) return '';
            return PREVIEW_API + encodeURIComponent(slug + '.prev.png');
        }

        function hideLoadingScreen() {
            const elapsed = Date.now() - loadingStartTime;
            const remaining = Math.max(0, MINIMUM_LOADING_TIME - elapsed);
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
                setTimeout(() => loadingScreen.style.display = 'none', 300);
            }, remaining);
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp * 1000);
            return date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        function truncateText(text, maxLength) {
            if (!text) return '';
            return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
        }

        function buildCategories() {
            categories = {};
            allChannels.forEach(channel => {
                const genre = channel.genre || 'general';
                if (!categories[genre]) categories[genre] = [];
                categories[genre].push(channel);
            });
        }

        function getGuideInfo(slug) {
            return guideData[slug] || null;
        }

        function getGuideProgrammes(channel) {
            const guide = getGuideInfo(channel.slug);
            if (!guide) return [];
            
            const programmes = [];
            
            if (guide.now_playing_title && guide.now_playing_next_programmes?.length > 0) {
                const nextProg = guide.now_playing_next_programmes[0];
                const now = Math.floor(Date.now() / 1000);
                
                programmes.push({
                    title: guide.now_playing_title,
                    start_timestamp: now,
                    end_timestamp: nextProg.start_timestamp,
                    isNow: true,
                    progress: guide.now_playing_progress || 0
                });
            }
            
            if (guide.now_playing_next_programmes) {
                guide.now_playing_next_programmes.forEach(prog => {
                    programmes.push({ ...prog, isNow: false });
                });
            }
            
            return programmes;
        }

        function showTooltip(element, title, startTime, endTime, channelSlug, isNow) {
            if (playerOpen) return;
            
            // Limpa timeout anterior
            clearTimeout(tooltipTimeout);
            
            // Define um novo timeout com delay de 1s
            tooltipTimeout = setTimeout(() => {
                const rect = element.getBoundingClientRect();
                
                let tooltipContent = '';
                
                // Adiciona preview apenas para programas ao vivo
                if (isNow && channelSlug) {
                    const previewUrl = getPreviewUrl(channelSlug);
                    tooltipContent += `<img src="${previewUrl}" alt="Preview" class="tooltip-preview" onerror="this.style.display='none'">`;
                }
                
                tooltipContent += '<div class="tooltip-content">';
                if (title) {
                    tooltipContent += `<div class="tooltip-title">${title}</div>`;
                }
                if (startTime && endTime) {
                    tooltipContent += `<div class="tooltip-time">${startTime} - ${endTime}</div>`;
                } else if (startTime) {
                    tooltipContent += `<div class="tooltip-time">${startTime}</div>`;
                }
                tooltipContent += '</div>';
                
                tooltip.innerHTML = tooltipContent;
                tooltip.style.display = 'block';
                
                const tooltipRect = tooltip.getBoundingClientRect();
                
                // Alinha o lado esquerdo do tooltip com o bloco
                let left = rect.left;
                let top = rect.top - tooltipRect.height - 8;
                
                // Verifica se o tooltip não ultrapassa a borda direita
                if (left + tooltipRect.width > window.innerWidth) {
                    left = window.innerWidth - tooltipRect.width - 8;
                }
                
                // Verifica se o tooltip não ultrapassa a borda esquerda
                if (left < 0) {
                    left = 8;
                }
                
                // Se não houver espaço acima, mostra abaixo
                if (top < 0) {
                    top = rect.bottom + 8;
                }
                
                tooltip.style.left = left + 'px';
                tooltip.style.top = top + 'px';
            }, 1000);
        }

        function hideTooltip() {
            clearTimeout(tooltipTimeout);
            tooltip.style.display = 'none';
        }

        function showSchedulePopup(title, subtitle, actionText, actionCallback) {
            schedulePopupTitle.textContent = title;
            schedulePopupSubtitle.textContent = subtitle;
            schedulePopupBtn.textContent = actionText;
            schedulePopup.classList.add('show');
            schedulePopupProgress.style.width = '100%';
            
            clearTimeout(popupTimeout);
            clearInterval(popupProgressInterval);
            
            let progress = 100;
            const totalDuration = 5000;
            const interval = 50;
            const decrement = (100 / totalDuration) * interval;
            
            popupProgressInterval = setInterval(() => {
                progress -= decrement;
                schedulePopupProgress.style.width = progress + '%';
                if (progress <= 0) {
                    clearInterval(popupProgressInterval);
                    hideSchedulePopup();
                }
            }, interval);
            
            schedulePopupBtn.onclick = () => {
                clearInterval(popupProgressInterval);
                hideSchedulePopup();
                actionCallback();
            };
            
            popupTimeout = setTimeout(() => {
                hideSchedulePopup();
            }, totalDuration);
        }

        function hideSchedulePopup() {
            schedulePopup.classList.remove('show');
            clearTimeout(popupTimeout);
            clearInterval(popupProgressInterval);
        }

        function handleScheduleClick(channelIndex, blockIndex) {
            const blockData = blocksData.find(b => b.channelIndex === channelIndex && b.blockIndex === blockIndex);
            if (!blockData) return;
            
            if (blockData.isNow) {
                openPlayerByIndex(channelIndex);
                return;
            }
            
            const channel = flatChannels[channelIndex];
            const guide = getGuideInfo(channel.slug);
            if (!guide) return;
            
            const prog = guide.now_playing_next_programmes?.[blockIndex - 1];
            if (!prog) return;
            
            const existingSchedule = schedules.find(s => 
                s.start_timestamp === prog.start_timestamp && 
                s.end_timestamp === prog.end_timestamp &&
                s.channelIndex !== channelIndex
            );
            
            if (existingSchedule) {
                showSchedulePopup(
                    'Substituir agendamento?',
                    `${prog.title} às ${formatTime(prog.start_timestamp)}`,
                    'Substituir',
                    () => {
                        schedules = schedules.filter(s => s !== existingSchedule);
                        schedules.push({
                            channelIndex,
                            title: prog.title,
                            start_timestamp: prog.start_timestamp,
                            end_timestamp: prog.end_timestamp
                        });
                        checkSchedules();
                    }
                );
            } else {
                showSchedulePopup(
                    'Agendar programação?',
                    `${prog.title} às ${formatTime(prog.start_timestamp)}`,
                    'Agendar',
                    () => {
                        schedules.push({
                            channelIndex,
                            title: prog.title,
                            start_timestamp: prog.start_timestamp,
                            end_timestamp: prog.end_timestamp
                        });
                        checkSchedules();
                    }
                );
            }
        }

        function checkSchedules() {
            const now = Math.floor(Date.now() / 1000);
            
            schedules.forEach((schedule, index) => {
                const timeUntilStart = schedule.start_timestamp - now;
                
                if (timeUntilStart <= 300 && timeUntilStart > 0 && !schedule.notified) {
                    schedule.notified = true;
                    const channel = flatChannels[schedule.channelIndex];
                    showSchedulePopup(
                        'Programação começando',
                        `${schedule.title} em ${channel?.name || ''}`,
                        'Assistir agora',
                        () => {
                            openPlayerByIndex(schedule.channelIndex);
                            schedules = schedules.filter(s => s !== schedule);
                        }
                    );
                } else if (timeUntilStart <= -300) {
                    schedules.splice(index, 1);
                }
            });
        }

        setInterval(checkSchedules, 1000);

        function highlightRow(channelIndex) {
            document.querySelectorAll('.guide-channel-item').forEach((el, i) => {
                if (i === channelIndex) {
                    el.classList.add('selected');
                } else {
                    el.classList.remove('selected');
                }
            });
            
            document.querySelectorAll('.guide-programme-row').forEach((el, i) => {
                if (i === channelIndex) {
                    el.classList.add('selected');
                } else {
                    el.classList.remove('selected');
                }
            });
        }

        function selectBlock(channelIndex, blockIndex, source) {
            selectedChannelIndex = channelIndex;
            selectedBlockIndex = blockIndex;
            
            document.querySelectorAll('.guide-programme-block').forEach(el => {
                el.classList.remove('keyboard-hover');
            });
            
            const blocks = document.querySelectorAll(`.guide-programme-row[data-channel-index="${channelIndex}"] .guide-programme-block`);
            if (blocks[blockIndex]) {
                if (source === 'keyboard') {
                    blocks[blockIndex].classList.add('keyboard-hover');
                    
                    const titleElement = blocks[blockIndex].querySelector('.guide-programme-title');
                    if (titleElement) {
                        const fullText = titleElement.textContent;
                        const blockData = blocksData.find(b => b.channelIndex === channelIndex && b.blockIndex === blockIndex);
                        
                        if (blockData && fullText !== 'Sem programação') {
                            const channel = flatChannels[channelIndex];
                            showTooltip(
                                blocks[blockIndex], 
                                fullText, 
                                formatTime(blockData.startTime), 
                                formatTime(blockData.endTime),
                                channel?.slug,
                                blockData.isNow
                            );
                        } else {
                            hideTooltip();
                        }
                    }
                }
                
                if (source === 'keyboard') {
                    const row = blocks[blockIndex].closest('.guide-programme-row');
                    if (row) {
                        const guideHeader = row.closest('.guide-wrapper').querySelector('.guide-time-header');
                        const headerHeight = guideHeader ? guideHeader.offsetHeight : 0;
                        const rowTop = row.offsetTop;
                        mainScroll.scrollTop = rowTop - headerHeight;
                    }
                }
            }
            
            highlightRow(channelIndex);
        }

        function handleChannelHover(element, channelIndex) {
            if (usingKeyboard || playerOpen) return;
            
            const channel = flatChannels[channelIndex];
            if (channel) {
                showTooltip(element, channel.name || '', null, null, null, false);
            }
        }

        function handleChannelLeave() {
            if (!usingKeyboard) {
                hideTooltip();
            }
        }

        function handleBlockHover(element, channelIndex, blockIndex) {
            if (usingKeyboard || playerOpen) return;
            
            selectBlock(channelIndex, blockIndex, 'mouse');
            
            const titleElement = element.querySelector('.guide-programme-title');
            if (titleElement) {
                const fullText = titleElement.textContent;
                const blockData = blocksData.find(b => b.channelIndex === channelIndex && b.blockIndex === blockIndex);
                
                if (blockData && fullText !== 'Sem programação') {
                    const channel = flatChannels[channelIndex];
                    showTooltip(
                        element, 
                        fullText, 
                        formatTime(blockData.startTime), 
                        formatTime(blockData.endTime),
                        channel?.slug,
                        blockData.isNow
                    );
                } else {
                    hideTooltip();
                }
            }
        }

        function handleBlockLeave() {
            if (!usingKeyboard) {
                hideTooltip();
            }
        }

        function navigateGrid(direction) {
            if (flatChannels.length === 0) return;
            
            usingKeyboard = true;
            hideTooltip();
            
            if (direction === 'up') {
                selectedChannelIndex = (selectedChannelIndex - 1 + flatChannels.length) % flatChannels.length;
                selectedBlockIndex = 0;
            } else if (direction === 'down') {
                selectedChannelIndex = (selectedChannelIndex + 1) % flatChannels.length;
                selectedBlockIndex = 0;
            } else if (direction === 'left') {
                const blocks = document.querySelectorAll(`.guide-programme-row[data-channel-index="${selectedChannelIndex}"] .guide-programme-block`);
                if (selectedBlockIndex > 0) {
                    selectedBlockIndex--;
                } else {
                    selectedBlockIndex = blocks.length - 1;
                }
            } else if (direction === 'right') {
                const blocks = document.querySelectorAll(`.guide-programme-row[data-channel-index="${selectedChannelIndex}"] .guide-programme-block`);
                if (selectedBlockIndex < blocks.length - 1) {
                    selectedBlockIndex++;
                } else {
                    selectedBlockIndex = 0;
                }
            }
            
            selectBlock(selectedChannelIndex, selectedBlockIndex, 'keyboard');
            
            if (direction === 'left' || direction === 'right') {
                const block = document.querySelector(`.guide-programme-row[data-channel-index="${selectedChannelIndex}"] .guide-programme-block:nth-child(${selectedBlockIndex + 1})`);
                if (block) {
                    const mainRect = mainScroll.getBoundingClientRect();
                    const blockRect = block.getBoundingClientRect();
                    
                    if (blockRect.left < mainRect.left || blockRect.right > mainRect.right) {
                        mainScroll.scrollLeft += blockRect.left - mainRect.left - 100;
                    }
                }
            }
        }

        function renderGuide() {
            if (!allChannels || allChannels.length === 0) {
                content.innerHTML = '<div class="text-center py-20 text-gray-600">Nenhum canal encontrado</div>';
                return;
            }
            
            buildCategories();
            
            const query = searchInput.value.toLowerCase().trim();
            
            const now = new Date();
            const currentHour = now.getHours();
            const startHour = currentHour;
            const totalHours = 24;
            
            const categoryOrder = ['general', '24h', 'movies', 'series', 'sports', 'espn', 'kids', 'music', 'documentary', 'entertainment', 'variety', 'news', 'religion', 'adult'];
            const categoryKeys = categoryOrder.filter(key => categories[key]?.length > 0);
            
            flatChannels = [];
            categoryKeys.forEach(key => {
                categories[key].forEach(channel => {
                    if (!query) {
                        flatChannels.push(channel);
                    } else {
                        const channelName = (channel.name || '').toLowerCase();
                        const guide = getGuideInfo(channel.slug);
                        let programmeTitles = '';
                        
                        if (guide) {
                            if (guide.now_playing_title) {
                                programmeTitles += guide.now_playing_title.toLowerCase() + ' ';
                            }
                            if (guide.now_playing_next_programmes) {
                                guide.now_playing_next_programmes.forEach(prog => {
                                    if (prog.title) {
                                        programmeTitles += prog.title.toLowerCase() + ' ';
                                    }
                                });
                            }
                        }
                        
                        if (channelName.includes(query) || programmeTitles.includes(query)) {
                            flatChannels.push(channel);
                        }
                    }
                });
            });
            
            if (flatChannels.length === 0) {
                content.innerHTML = '<div class="text-center py-20 text-gray-600">Nenhum canal encontrado</div>';
                return;
            }
            
            let hoursHtml = '';
            for (let i = 0; i < totalHours; i++) {
                const hour = (startHour + i) % 24;
                const hourStr = String(hour).padStart(2, '0') + ':00';
                
                hoursHtml += `
                    <div class="guide-hour">
                        ${hourStr}
                    </div>
                `;
            }
            
            let channelListHtml = '';
            let programmesHtml = '';
            
            const startOfDay = new Date(now);
            startOfDay.setHours(startHour, 0, 0, 0);
            guideStartTimestamp = Math.floor(startOfDay.getTime() / 1000);
            guideEndTimestamp = guideStartTimestamp + totalHours * 3600;
            
            blocksData = [];
            
            const nowTimestamp = Math.floor(Date.now() / 1000);
            
            flatChannels.forEach((channel, channelIndex) => {
                const logo = getProxiedLogo(channel.logo || channel.cover);
                const programmes = getGuideProgrammes(channel);
                
                channelListHtml += `
                    <div class="guide-channel-item" 
                         onclick='openPlayerByIndex(${channelIndex})' 
                         onmouseenter='handleChannelHover(this, ${channelIndex})'
                         onmouseleave='handleChannelLeave()'>
                        <img src="${logo}" alt="${channel.name}" onerror="this.style.display='none'">
                    </div>
                `;
                
                let rowHtml = `<div class="guide-programme-row" data-channel-index="${channelIndex}">`;
                
                let currentTime = guideStartTimestamp;
                let programmeIndex = 0;
                let blockIndex = 0;
                
                while (currentTime < guideEndTimestamp) {
                    const prog = programmes[programmeIndex];
                    
                    if (!prog) {
                        const width = Math.round(((guideEndTimestamp - currentTime) / 3600) * HOUR_WIDTH);
                        rowHtml += `
                            <div class="guide-programme-block guide-programme-empty" 
                                 style="width: ${width}px; min-width: ${width}px;"
                                 onclick='openPlayerByIndex(${channelIndex})'
                                 onmouseenter='handleBlockHover(this, ${channelIndex}, ${blockIndex})'
                                 onmouseleave='handleBlockLeave()'>
                            </div>
                        `;
                        blocksData.push({ 
                            channelIndex, 
                            blockIndex, 
                            isNow: false, 
                            isEmpty: true,
                            startTime: currentTime,
                            endTime: guideEndTimestamp
                        });
                        break;
                    }
                    
                    let blockStart;
                    let blockEnd;
                    
                    // Correção: primeiro bloco (programa atual) começa no início da grade (hora cheia)
                    if (programmeIndex === 0 && prog.isNow) {
                        blockStart = currentTime;
                        blockEnd = Math.min(prog.end_timestamp || guideEndTimestamp, guideEndTimestamp);
                    } else {
                        blockStart = Math.max(prog.start_timestamp || currentTime, currentTime);
                        blockEnd = Math.min(prog.end_timestamp || blockStart + 3600, guideEndTimestamp);
                    }
                    
                    if (blockEnd <= blockStart) {
                        programmeIndex++;
                        continue;
                    }
                    
                    const duration = blockEnd - blockStart;
                    const width = Math.round((duration / 3600) * HOUR_WIDTH);
                    
                    const isNow = blockStart <= nowTimestamp && blockEnd > nowTimestamp;
                    const isFuture = blockStart > nowTimestamp;
                    
                    const clickHandler = isNow 
                        ? `onclick='openPlayerByIndex(${channelIndex})'` 
                        : isFuture 
                            ? `onclick='handleScheduleClick(${channelIndex}, ${blockIndex})'` 
                            : '';
                    
                    const futureClass = isFuture ? 'guide-programme-future' : '';
                    const nowClass = isNow ? 'guide-programme-now' : '';
                    
                    rowHtml += `
                        <div class="guide-programme-block ${nowClass} ${futureClass}" 
                             style="width: ${width}px; min-width: ${width}px;"
                             ${clickHandler}
                             onmouseenter='handleBlockHover(this, ${channelIndex}, ${blockIndex})'
                             onmouseleave='handleBlockLeave()'>
                            <span class="guide-programme-title">${prog.title || ''}</span>
                            <span class="guide-programme-time">${formatTime(blockStart)}</span>
                        </div>
                    `;
                    
                    blocksData.push({ 
                        channelIndex, 
                        blockIndex, 
                        isNow,
                        startTime: blockStart,
                        endTime: blockEnd
                    });
                    
                    currentTime = blockEnd;
                    programmeIndex++;
                    blockIndex++;
                }
                
                rowHtml += '</div>';
                programmesHtml += rowHtml;
            });
            
            content.innerHTML = `
                <div class="guide-wrapper">
                    <div class="guide-channels">
                        <div class="guide-time-header">
                            <div class="guide-time-header-spacer"></div>
                            <div class="guide-time-header-hours">${hoursHtml}</div>
                        </div>
                        <div class="guide-body">
                            <div class="guide-channel-list">${channelListHtml}</div>
                            <div class="guide-programmes">
                                <div class="guide-now-line" id="nowLine"></div>
                                ${programmesHtml}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            updateNowLine();
            
            selectedChannelIndex = 0;
            selectedBlockIndex = 0;
            
            // Abre o canal diretamente se houver parâmetro na URL
            const urlParams = new URLSearchParams(window.location.search);
            const channelParam = urlParams.get('c');
            if (channelParam) {
                const channelSlug = channelParam.toLowerCase();
                const channelIndex = flatChannels.findIndex(c => (c.slug || c.name || '').toLowerCase() === channelSlug);
                if (channelIndex >= 0) {
                    setTimeout(() => openPlayerByIndex(channelIndex), 500);
                }
            }
        }

        function updateNowLine() {
            const nowLine = document.getElementById('nowLine');
            if (!nowLine || !guideStartTimestamp) return;
            
            const nowTimestamp = Math.floor(Date.now() / 1000);
            const elapsedSeconds = nowTimestamp - guideStartTimestamp;
            const nowPosition = Math.round((elapsedSeconds / 3600) * HOUR_WIDTH);
            
            nowLine.style.left = nowPosition + 'px';
        }

        function checkForHourChange() {
            const now = new Date();
            const currentHour = now.getHours();
            
            if (lastGuideUpdateHour === null) {
                lastGuideUpdateHour = currentHour;
            } else if (currentHour !== lastGuideUpdateHour) {
                lastGuideUpdateHour = currentHour;
                refreshGuideData();
            }
        }

        async function refreshGuideData() {
            try {
                await loadGuide();
                renderGuide();
                console.log('Guia atualizado às', new Date().toLocaleTimeString('pt-BR'));
            } catch (error) {
                console.error('Erro ao atualizar guia:', error);
            }
        }

        function openPlayerByIndex(index) {
            const channel = flatChannels[index];
            if (!channel) return;
            
            selectedChannelIndex = index;
            playerOpen = true;
            hideTooltip();

            iframe.src = channel.url + (channel.url.includes('?') ? '&' : '?') + 'autoplay=1';
            modalLogo.src = getProxiedLogo(channel.logo || channel.cover);
            modalName.textContent = channel.name;
            
            const guide = getGuideInfo(channel.slug);
            modalNowPlaying.textContent = guide?.now_playing_title || '';
            
            player.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            showPlayerHeader();
            
            // Atualiza a URL com o canal atual
            const channelSlug = channel.slug || channel.name || '';
            const newUrl = window.location.pathname + '?c=' + encodeURIComponent(channelSlug.toLowerCase());
            history.pushState({ playerOpen: true, channel: channelSlug.toLowerCase() }, '', newUrl);
        }

        function showPlayerHeader() {
            playerHeader.classList.remove('hidden-header');
            clearTimeout(headerTimeout);
            headerTimeout = setTimeout(() => playerHeader.classList.add('hidden-header'), 3000);
        }

        function closePlayer() {
            playerOpen = false;
            player.classList.add('hidden');
            iframe.src = '';
            document.body.style.overflow = '';
            playerHeader.classList.remove('hidden-header');
            hideTooltip();
            
            // Remove o parâmetro da URL
            const newUrl = window.location.pathname;
            history.pushState({ playerOpen: false }, '', newUrl);
        }

        window.addEventListener('popstate', () => {
            if (playerOpen) {
                playerOpen = false;
                player.classList.add('hidden');
                iframe.src = '';
                document.body.style.overflow = '';
                playerHeader.classList.remove('hidden-header');
                hideTooltip();
            }
        });

        function navigatePlayer(direction) {
            if (flatChannels.length === 0) return;
            
            if (direction === 'left' || direction === 'up') {
                selectedChannelIndex = (selectedChannelIndex - 1 + flatChannels.length) % flatChannels.length;
            } else if (direction === 'right' || direction === 'down') {
                selectedChannelIndex = (selectedChannelIndex + 1) % flatChannels.length;
            }
            
            openPlayerByIndex(selectedChannelIndex);
        }

        player.addEventListener('mousemove', () => {
            if (playerOpen) showPlayerHeader();
        });

        player.addEventListener('touchstart', () => {
            if (playerOpen) showPlayerHeader();
        });

        document.addEventListener('mousemove', () => {
            usingKeyboard = false;
        });

        async function loadGuide() {
            try {
                const res = await fetch(GUIDE_API);
                const data = await res.json();
                if (data.success && data.data) {
                    guideData = {};
                    data.data.forEach(channel => {
                        guideData[channel.id] = channel;
                    });
                }
            } catch {
                console.log('Não foi possível carregar o guia de programação');
            }
        }

        async function loadChannels() {
            try {
                const res = await fetch(CHANNELS_API);
                const data = await res.json();
                
                if (Array.isArray(data)) {
                    allChannels = data;
                } else {
                    allChannels = data.data || [];
                }
                
                await loadGuide();
                renderGuide();
                hideLoadingScreen();
                
                // Inicializa os intervalos de atualização
                initializeAutoUpdates();
            } catch (error) {
                console.error('Erro:', error);
                hideLoadingScreen();
                content.innerHTML = `
                    <div class="text-center py-20 text-gray-600">
                        <i class="fa-solid fa-exclamation-circle text-2xl mb-3"></i>
                        <p class="text-sm">Erro ao carregar canais</p>
                        <button onclick="loadChannels()" class="mt-3 text-gray-400 hover:text-gray-300 text-sm underline">
                            Tentar novamente
                        </button>
                    </div>
                `;
            }
        }

        function initializeAutoUpdates() {
            // Atualiza a linha do tempo a cada segundo
            nowLineUpdateInterval = setInterval(() => {
                updateNowLine();
            }, 1000);
            
            // Verifica mudança de hora a cada 30 segundos
            guideUpdateInterval = setInterval(() => {
                checkForHourChange();
            }, 30000);
            
            // Atualiza a programação completa a cada 5 minutos
            setInterval(() => {
                refreshGuideData();
            }, 300000);
        }

        // Limpa os intervalos quando a página for fechada
        window.addEventListener('beforeunload', () => {
            if (nowLineUpdateInterval) clearInterval(nowLineUpdateInterval);
            if (guideUpdateInterval) clearInterval(guideUpdateInterval);
            if (tooltipTimeout) clearTimeout(tooltipTimeout);
        });

        loadChannels();
    </script>
</body>
</html>
